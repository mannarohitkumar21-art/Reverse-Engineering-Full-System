name: Build and publish release ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          mkdir -p dist
          zip -r dist/Universal-RE-Engine-${GITHUB_REF_NAME}.zip . \
            -x ".git/*" "dist/*" ".github/*" "__pycache__/*" "*.pyc"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Universal-RE-Engine-${{ github.ref_name }}.zip
